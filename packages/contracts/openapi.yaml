openapi: 3.1.0
info:
  title: Household Expenses API
  version: 1.0.0
  description: >-
    Canonical authentication and expense synchronization API for the fixed
    Sumon/Ebrahim household. Money is represented only as integer BDT poisha,
    and every accepted amount is a whole number of taka, so amountMinor is
    always a multiple of 100. Shared expenses belong to a spending period that
    the household closes by hand after settling up. Manual loans are tracked in
    a separate ledger with its own total. Dashboard summaries are computed by
    Flutter from synchronized local rows.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current deployment host.
tags:
  - name: Operations
    description: Process and PostgreSQL health checks.
  - name: Authentication
    description: Fixed-member login and token lifecycle.
  - name: Synchronization
    description: Idempotent mutation push, change pull, and first-device bootstrap.
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: The API process is running; the database is not checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      security: []
      responses:
        '200':
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: PostgreSQL is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health:
    get:
      tags: [Operations]
      operationId: getCompositeHealth
      summary: Check process health and PostgreSQL readiness
      security: []
      responses:
        '200':
          description: The process is running and PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeHealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The process is running but PostgreSQL is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeHealthResponse'
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate one of the two fixed members
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new session pair
      description: >-
        A successful call revokes the supplied token. Reuse of an already
        rotated token revokes its active token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The refresh token was rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the supplied refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logout completed; an already invalid token is also accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentMember
      summary: Return the authenticated fixed member
      responses:
        '200':
          description: The access token belongs to an enabled member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sync/mutations:
    post:
      tags: [Synchronization]
      operationId: pushExpenseMutations
      summary: Apply an ordered batch of durable client mutations
      description: >-
        Items are processed in request order, each in its own serializable
        transaction. A conflict or rejection does not roll back accepted sibling
        items. Retrying an identical mutationId returns its stored result;
        reusing the ID for different semantics is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationBatchRequest'
      responses:
        '200':
          description: Every candidate has a corresponding result in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sync/changes:
    get:
      tags: [Synchronization]
      operationId: pullExpenseChanges
      summary: Pull ordered changes after an opaque cursor
      parameters:
        - $ref: '#/components/parameters/ChangeCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: An ordered page of changes, including deletion tombstones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sync/bootstrap:
    get:
      tags: [Synchronization]
      operationId: bootstrapExpenses
      summary: Bootstrap a first device from a stable watermark
      description: >-
        Start without pageToken and keep calling until nextPageToken is null.
        Pages carry expenses, spending periods, and loans; each item names its
        own entityType. Items are walked in the order PERIOD, EXPENSE, LOAN, so
        every spending period arrives before the expenses that reference it.
        Persist the returned watermarkCursor only after all bootstrap pages are
        applied, then pull /v1/sync/changes from that watermark before declaring
        the first synchronization complete.
      parameters:
        - $ref: '#/components/parameters/BootstrapPageToken'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A canonical entity page including existing tombstones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChangeCursor:
      name: cursor
      in: query
      required: false
      description: Opaque, signed cursor returned by a prior change/bootstrap response.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    BootstrapPageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque, signed page token from the preceding bootstrap page.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 100
  responses:
    BadRequest:
      description: Invalid JSON, HTTPS required, or another malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credentials or bearer/refresh token are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BodyTooLarge:
      description: The JSON body exceeds the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Input did not pass request-level validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The configured per-window request limit was exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until another attempt should be made.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A serializable transaction could not complete after bounded retries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MemberKey:
      type: string
      enum: [SUMON, EBRAHIM]
    ExpenseCategory:
      type: string
      enum: [GROCERIES, UTILITIES, TRANSPORT, HOUSEHOLD, MEDICINE, OTHER]
    MutationOperation:
      type: string
      enum: [CREATE, UPDATE, DELETE]
    EntityType:
      type: string
      enum: [EXPENSE, PERIOD, LOAN]
      description: >-
        Which synchronized entity a mutation, result, change, or bootstrap item
        refers to. Absent values are read as EXPENSE.
    Member:
      type: object
      additionalProperties: false
      required: [id, householdId, key, displayName]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/MemberKey'
        displayName:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [member, pin]
      properties:
        member:
          $ref: '#/components/schemas/MemberKey'
        pin:
          type: string
          pattern: '^\d{6,12}$'
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 80
          maxLength: 200
          writeOnly: true
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - member
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        member:
          $ref: '#/components/schemas/Member'
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    CurrentMemberResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/Member'
    ExpenseInput:
      type: object
      additionalProperties: false
      required: [amountMinor, category, payer, occurredAt]
      properties:
        amountMinor:
          type: integer
          minimum: 100
          maximum: 99999999999
          multipleOf: 100
          description: >-
            BDT poisha; never a decimal BDT amount. Only whole taka are
            accepted, so the value is always a multiple of 100.
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        payer:
          $ref: '#/components/schemas/MemberKey'
        occurredAt:
          type: string
          format: date-time
          description: An RFC 3339 timestamp with an explicit UTC offset.
        note:
          type: [string, 'null']
          maxLength: 500
        periodId:
          type: string
          format: uuid
          description: >-
            Spending period this expense belongs to. Omit it to let the server
            assign the household's currently open period. An unknown period is
            rejected with PERIOD_NOT_FOUND; a closed period is accepted, because
            an expense created offline before a close still belongs to the
            period it was recorded in.
    Expense:
      type: object
      additionalProperties: false
      required:
        - id
        - amountMinor
        - category
        - payer
        - occurredAt
        - note
        - periodId
        - version
        - updatedAt
        - deletedAt
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 100
          maximum: 99999999999
          multipleOf: 100
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        payer:
          $ref: '#/components/schemas/MemberKey'
        occurredAt:
          type: string
          format: date-time
        note:
          type: [string, 'null']
          maxLength: 500
        periodId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Non-null identifies a soft-delete tombstone.
    PeriodInput:
      type: object
      additionalProperties: false
      required: [sequenceNumber, startedAt]
      description: >-
        A spending period. Closing the household's history is an UPDATE that
        sets closedAt, followed by a CREATE for the next period. Periods are
        never deleted, because active expenses reference them.
      properties:
        sequenceNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >-
            Human-facing period number, starting at 1. The server rejects a
            CREATE with PERIOD_ALREADY_OPEN while another period is open, so
            two devices cannot both open a period.
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Non-null marks the period settled and archived. It must not precede
            startedAt. A closed period cannot be reopened.
        note:
          type: [string, 'null']
          maxLength: 500
    SpendingPeriod:
      type: object
      additionalProperties: false
      required:
        - id
        - sequenceNumber
        - startedAt
        - closedAt
        - note
        - version
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    LoanInput:
      type: object
      additionalProperties: false
      required: [debtor, amountMinor, occurredAt]
      description: >-
        One manually recorded loan between the two members. The debtor owes the
        amount; the other member is the creditor. Loans are tracked separately
        from shared expenses and never affect the expense settlement figure.
      properties:
        debtor:
          $ref: '#/components/schemas/MemberKey'
        amountMinor:
          type: integer
          minimum: 100
          maximum: 99999999999
          multipleOf: 100
        occurredAt:
          type: string
          format: date-time
          description: >-
            Recorded automatically by the client when the entry is created; an
            RFC 3339 timestamp with an explicit UTC offset.
        note:
          type: [string, 'null']
          maxLength: 500
    LoanEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - debtor
        - amountMinor
        - occurredAt
        - note
        - version
        - updatedAt
        - deletedAt
      properties:
        id:
          type: string
          format: uuid
        debtor:
          $ref: '#/components/schemas/MemberKey'
        amountMinor:
          type: integer
          minimum: 100
          maximum: 99999999999
          multipleOf: 100
        occurredAt:
          type: string
          format: date-time
        note:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Non-null identifies a soft-delete tombstone.
    MutationCandidate:
      type: object
      additionalProperties: false
      required: [mutationId, entityId, operation, baseVersion]
      description: >-
        entityType selects which payload key is required, and defaults to
        EXPENSE. CREATE requires baseVersion 0; UPDATE and DELETE require a
        positive baseVersion. CREATE and UPDATE require the matching payload
        (expense, period, or loan); DELETE requires no payload. A PERIOD DELETE
        is always rejected. Operation-specific invalid data is returned as a
        REJECTED result so valid siblings can still apply.
      properties:
        mutationId:
          type: string
          format: uuid
          description: Unique durable outbox mutation UUID; never reuse it for another payload.
        entityId:
          type: string
          format: uuid
          description: Client-generated UUID of the expense, period, or loan.
        entityType:
          $ref: '#/components/schemas/EntityType'
        operation:
          $ref: '#/components/schemas/MutationOperation'
        baseVersion:
          type: integer
          minimum: 0
          maximum: 2147483646
        expense:
          $ref: '#/components/schemas/ExpenseInput'
        period:
          $ref: '#/components/schemas/PeriodInput'
        loan:
          $ref: '#/components/schemas/LoanInput'
    MutationBatchRequest:
      type: object
      additionalProperties: false
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/MutationCandidate'
    AppliedMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, status, entityType]
      description: >-
        Exactly one payload key is present, selected by entityType.
      properties:
        mutationId:
          type: string
          format: uuid
        status:
          type: string
          const: APPLIED
        entityType:
          $ref: '#/components/schemas/EntityType'
        expense:
          $ref: '#/components/schemas/Expense'
        period:
          $ref: '#/components/schemas/SpendingPeriod'
        loan:
          $ref: '#/components/schemas/LoanEntry'
    ConflictMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, status, entityType, code]
      description: >-
        Carries the authoritative server state. Exactly one payload key is
        present, selected by entityType.
      properties:
        mutationId:
          type: string
          format: uuid
        status:
          type: string
          const: CONFLICT
        entityType:
          $ref: '#/components/schemas/EntityType'
        code:
          type: string
          enum: [ENTITY_EXISTS, VERSION_CONFLICT]
        expense:
          $ref: '#/components/schemas/Expense'
        period:
          $ref: '#/components/schemas/SpendingPeriod'
        loan:
          $ref: '#/components/schemas/LoanEntry'
    RejectedMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, status, code]
      properties:
        mutationId:
          type: string
          format: uuid
        status:
          type: string
          const: REJECTED
        code:
          type: string
          enum:
            - ENTITY_ID_UNAVAILABLE
            - ENTITY_NOT_FOUND
            - IDEMPOTENCY_KEY_REUSED
            - INVALID_MUTATION
            - PAYER_NOT_FOUND
            - PERIOD_ALREADY_OPEN
            - PERIOD_NOT_FOUND
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    MutationResult:
      oneOf:
        - $ref: '#/components/schemas/AppliedMutationResult'
        - $ref: '#/components/schemas/ConflictMutationResult'
        - $ref: '#/components/schemas/RejectedMutationResult'
      discriminator:
        propertyName: status
        mapping:
          APPLIED: '#/components/schemas/AppliedMutationResult'
          CONFLICT: '#/components/schemas/ConflictMutationResult'
          REJECTED: '#/components/schemas/RejectedMutationResult'
    MutationBatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MutationResult'
    EntityChange:
      type: object
      additionalProperties: false
      required: [cursor, entityType, operation, originMutationId]
      description: >-
        One synchronized change. Exactly one payload key is present, selected by
        entityType. PERIOD changes are never DELETED.
      properties:
        cursor:
          type: string
        entityType:
          $ref: '#/components/schemas/EntityType'
        operation:
          type: string
          enum: [CREATED, UPDATED, DELETED]
        originMutationId:
          type: string
          format: uuid
        expense:
          $ref: '#/components/schemas/Expense'
        period:
          $ref: '#/components/schemas/SpendingPeriod'
        loan:
          $ref: '#/components/schemas/LoanEntry'
    ChangePage:
      type: object
      additionalProperties: false
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/EntityChange'
        nextCursor:
          type: string
          description: Persist only after every change in this page is applied transactionally.
        hasMore:
          type: boolean
    BootstrapItem:
      type: object
      additionalProperties: false
      required: [entityType]
      description: >-
        One canonical entity. Exactly one payload key is present, selected by
        entityType.
      properties:
        entityType:
          $ref: '#/components/schemas/EntityType'
        expense:
          $ref: '#/components/schemas/Expense'
        period:
          $ref: '#/components/schemas/SpendingPeriod'
        loan:
          $ref: '#/components/schemas/LoanEntry'
    BootstrapPage:
      type: object
      additionalProperties: false
      required: [items, watermarkCursor, nextPageToken, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapItem'
        watermarkCursor:
          type: string
        nextPageToken:
          type: [string, 'null']
        hasMore:
          type: boolean
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ok
        checks:
          type: object
          additionalProperties: false
          required: [process]
          properties:
            process:
              type: string
              const: up
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    CompositeHealthResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [process, database]
