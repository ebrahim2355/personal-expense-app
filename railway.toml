[build]
builder = "NIXPACKS"
buildCommand = "npm ci --include=dev && npm run build --workspace @expenses/api"

[deploy]
preDeployCommand = "npm run prisma:migrate:deploy --workspace @expenses/api"
startCommand = "npm run start --workspace @expenses/api"
healthcheckPath = "/health/ready"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
