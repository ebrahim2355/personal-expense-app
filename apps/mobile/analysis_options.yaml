include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Drift emits the historical schemas used by the migration test as raw
    # `TableInfo` subclasses, which strict-raw-types flags in code nobody edits.
    - test/generated/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    directives_ordering: true
    prefer_single_quotes: true
    require_trailing_commas: true
